<div class="p-6 max-w-3xl mx-auto bg-white rounded-2xl shadow-lg mt-6">
  <h2 class="text-2xl font-semibold mb-4">Gestión de Tarjetas</h2>

  <!-- Botones de acción -->
  <div class="grid grid-cols-2 gap-4 mb-4">
    <button (click)="loadCards()" class="btn bg-blue-500 text-white">🔄 Cargar tarjetas</button>
    <button (click)="createCard('DEBIT')" class="btn bg-green-500 text-white">💳 Crear tarjeta débito</button>
    <button (click)="createCard('CREDIT')" class="btn bg-yellow-500 text-white">💳 Crear tarjeta crédito</button>
  </div>

  <!-- Listado de tarjetas -->
  <div *ngIf="cards.length > 0" class="space-y-4">
    <div *ngFor="let card of cards" class="border p-4 rounded-lg shadow-sm">
      <div class="flex justify-between">
        <div>
          <h3 class="font-semibold text-lg">{{ card.type }} ({{ card.status }})</h3>
          <p>Saldo: {{ card.balance | currency }}</p>
        </div>
        <div class="flex gap-2">
          <button *ngIf="card.status === 'PENDING'" (click)="activateCard(card.user_id)" class="btn bg-blue-600 text-white">Activar</button>
          <button (click)="getReport(card.uuid)" class="btn bg-gray-500 text-white">📊 Reporte</button>
        </div>
      </div>

      <!-- Añadir saldo -->
      <div *ngIf="card.type === 'DEBIT'" class="mt-3">
        <input type="number" placeholder="Monto a agregar" [(ngModel)]="addAmount" class="input w-1/2" />
        <button (click)="saveTransaction(card.uuid)" class="btn bg-green-600 text-white">💵 Agregar saldo</button>
      </div>

      <!-- Pagar crédito -->
      <div *ngIf="card.type === 'CREDIT'" class="mt-3">
        <input type="number" placeholder="Monto a pagar" [(ngModel)]="payAmount" class="input w-1/2" />
        <button (click)="payCredit(card.uuid)" class="btn bg-yellow-600 text-white">💰 Pagar crédito</button>
      </div>
    </div>
  </div>

  <div *ngIf="cards.length === 0" class="text-gray-500 text-center mt-6">
    No hay tarjetas disponibles.
  </div>
</div>
