<div class="transactions-container">
  <h2>📜 Historial de Transacciones</h2>

  <div class="mb-4 text-center">
    <button (click)="loadTransactions()" class="btn-blue">Actualizar</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Descripción</th>
        <th>Monto</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let tx of transactions">
        <td>{{ tx.date }}</td>
        <td>{{ tx.description }}</td>
        <td class="text-right">{{ tx.amount | currency:'COP' }}</td>
      </tr>
    </tbody>
  </table>

  <hr />

  <!-- 💰 Recargar dinero -->
  <h3>💰 Recargar dinero</h3>
  <form (ngSubmit)="addMoney()" class="form-grid">
    <div class="form-group">
      <label for="cardId">ID de la tarjeta</label>
      <input [(ngModel)]="addMoneyData.cardId" id="cardId" name="cardId" placeholder="UUID de tarjeta" class="input" />
    </div>

    <div class="form-group">
      <label for="amount">Monto</label>
      <input [(ngModel)]="addMoneyData.amount" id="amount" name="amount" placeholder="Monto a recargar" type="number" class="input" />
    </div>

    <div class="form-group button-container">
      <button type="submit" class="btn-yellow">Recargar</button>
    </div>
  </form>

  <hr />

  <!-- 🛒 Nueva compra -->
  <h3>🛒 Nueva Compra</h3>
  <form (ngSubmit)="makePurchase()" class="form-grid">
    <div class="form-group">
      <label for="purchaseCard">ID de la tarjeta</label>
      <input [(ngModel)]="purchaseData.cardId" id="purchaseCard" name="cardId" placeholder="UUID de tarjeta" class="input" />
    </div>

    <div class="form-group">
      <label for="merchant">Comercio</label>
      <input [(ngModel)]="purchaseData.merchant" id="merchant" name="merchant" placeholder="Nombre del comercio" class="input" />
    </div>

    <div class="form-group">
      <label for="purchaseAmount">Monto</label>
      <input [(ngModel)]="purchaseData.amount" id="purchaseAmount" name="amount" placeholder="Valor de compra" type="number" class="input" />
    </div>

    <div class="form-group button-container">
      <button type="submit" class="btn-yellow">Comprar</button>
    </div>
  </form>
</div>
