<div class="p-6 bg-white rounded-2xl shadow-md">
  <h2 class="text-xl font-semibold mb-4">Historial de Transacciones</h2>

  <div class="mb-4">
    <button (click)="loadTransactions()" class="btn-blue">Actualizar</button>
  </div>

  <table class="min-w-full text-left border">
    <thead class="bg-blue-800 text-white">
      <tr>
        <th class="p-2">Fecha</th>
        <th class="p-2">Descripción</th>
        <th class="p-2">Monto</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let tx of transactions" class="border-b">
        <td class="p-2">{{ tx.date }}</td>
        <td class="p-2">{{ tx.description }}</td>
        <td class="p-2 text-right">{{ tx.amount | currency:'COP' }}</td>
      </tr>
    </tbody>
  </table>

  <hr class="my-6" />

  <!-- 💳 Recargar dinero -->
  <h3 class="text-lg font-semibold mb-3">Recargar dinero</h3>
  <form (ngSubmit)="addMoney()" class="grid grid-cols-1 md:grid-cols-3 gap-3">
    <input [(ngModel)]="addMoneyData.cardId" name="cardId" placeholder="ID tarjeta" class="input" />
    <input [(ngModel)]="addMoneyData.amount" name="amount" placeholder="Monto" type="number" class="input" />
    <button type="submit" class="btn-yellow">Recargar</button>
  </form>

  <hr class="my-6" />

  <h3 class="text-lg font-semibold mb-3">Nueva Compra</h3>
  <form (ngSubmit)="makePurchase()" class="grid grid-cols-1 md:grid-cols-3 gap-3">
  <input [(ngModel)]="purchaseData.cardId" name="cardId" placeholder="ID de la tarjeta (UUID)" class="input" />
  <input [(ngModel)]="purchaseData.merchant" name="merchant" placeholder="Nombre del comercio" class="input" />
  <input [(ngModel)]="purchaseData.amount" name="amount" placeholder="Monto" type="number" class="input" />
  <button type="submit" class="btn-yellow">Comprar</button>
</form>

</div>
