<!-- 🔹 Header con botón de cerrar sesión -->
<div class="header-actions">
  <button class="icon-btn logout" (click)="logout()">
    <img src="assets/icons/logout.svg" alt="Cerrar sesión" class="icon" />
    <span>Cerrar sesión</span>
  </button>
</div>

<!-- 💳 Contenedor principal -->
<div class="home-container">
  <div class="balance-card animate-fade-in">
    <h1 class="title">Bienvenido a tu Banco Online 💳</h1>

    <p class="subtitle">
      Gestiona tus tarjetas y transacciones de forma rápida y segura.
    </p>

    <div class="actions">
      <button routerLink="/transactions" class="btn-yellow">
        💸 Ver Transacciones
      </button>
      <button routerLink="/cards" class="btn-white">
        💳 Ver Tarjetas
      </button>
    </div>
  </div>

  <!-- 🔹 Sección inferior con opciones -->
  <div class="card-grid">
    <div class="feature-card animate-slide-up">
      <h3>💸 Transferencias</h3>
      <p>Envía dinero a otros usuarios fácilmente.</p>
      <button routerLink="/transactions" class="btn-blue">Transferir</button>
    </div>

    <div class="feature-card animate-slide-up">
      <h3>💳 Tarjetas</h3>
      <p>Consulta tus tarjetas activas o solicita una nueva.</p>
      <button routerLink="/cards" class="btn-blue">Ver tarjetas</button>
    </div>
  </div>
</div>
