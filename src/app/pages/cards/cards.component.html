<div class="p-6 max-w-3xl mx-auto bg-white rounded-2xl shadow-lg mt-6">
  <h2 class="text-2xl font-semibold mb-4 text-center">Gestión de Tarjetas</h2>

  <!-- Botones principales -->
  <div class="grid grid-cols-3 gap-4 mb-6">
    <button (click)="loadCards()" class="bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
      🔄 Cargar tarjetas
    </button>
    <button (click)="createCard('DEBIT')" class="bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">
      💳 Crear tarjeta débito
    </button>
    <button (click)="createCard('CREDIT')" class="bg-yellow-500 text-white py-2 rounded-lg hover:bg-yellow-600">
      💳 Crear tarjeta crédito
    </button>
  </div>

  <!-- Listado de tarjetas -->
  <div *ngIf="cards.length > 0; else noCards" class="space-y-4">
    <div *ngFor="let card of cards" class="border border-gray-300 p-4 rounded-xl shadow-sm">
      <div class="flex justify-between items-center mb-3">
        <div>
          <h3 class="font-semibold text-lg">
            {{ card.type }} <span class="text-gray-500">({{ card.status }})</span>
          </h3>
          <p class="text-sm text-gray-600">Saldo: {{ card.balance | currency }}</p>
        </div>

        <div class="flex gap-2">
          <button
            *ngIf="card.status === 'PENDING'"
            (click)="activateCard(card.uuid)"
            class="bg-blue-500 text-white px-3 py-1 rounded-lg hover:bg-blue-600"
          >
            ⚙️ Activar
          </button>
          <button
            (click)="getReport(card.uuid)"
            class="bg-gray-500 text-white px-3 py-1 rounded-lg hover:bg-gray-600"
          >
            📊 Reporte
          </button>
        </div>
      </div>

      <!-- Añadir saldo -->
      <div *ngIf="card.type === 'DEBIT'" class="mt-3 flex gap-2 items-center">
        <input
          type="number"
          placeholder="Monto a agregar"
          [(ngModel)]="addAmount"
          class="border rounded-lg p-2 flex-1"
        />
        <button
          (click)="saveTransaction(card.uuid)"
          class="bg-green-600 text-white px-3 py-2 rounded-lg hover:bg-green-700"
        >
          💵 Agregar saldo
        </button>
      </div>

      <!-- Pagar crédito -->
      <div *ngIf="card.type === 'CREDIT'" class="mt-3 flex gap-2 items-center">
        <input
          type="number"
          placeholder="Monto a pagar"
          [(ngModel)]="payAmount"
          class="border rounded-lg p-2 flex-1"
        />
        <button
          (click)="payCredit(card.uuid)"
          class="bg-yellow-600 text-white px-3 py-2 rounded-lg hover:bg-yellow-700"
        >
          💰 Pagar crédito
        </button>
      </div>
    </div>
  </div>

  <ng-template #noCards>
    <p class="text-gray-500 text-center mt-6">No hay tarjetas disponibles.</p>
  </ng-template>
</div>
