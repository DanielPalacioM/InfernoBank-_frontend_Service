<div class="card-wrapper">
  <div class="card-container">
    <div class="card-header">
      <img
        src="assets/icons/tarjeta-bancaria.png"
        alt="Tarjeta de crédito"
        class="card-image"
      />
      <h2>💳 Tarjeta de Crédito</h2>
      <p>
        Estado:
        <span [ngClass]="activated ? 'active' : 'inactive'">
          {{ activated ? 'ACTIVADA ✅' : 'PENDIENTE DE ACTIVAR' }}
        </span>
      </p>
    </div>

    <!-- Si NO está activada -->
    <ng-container *ngIf="!activated; else activatedCard">
      <button
        (click)="activateCard()"
        [disabled]="loading"
        class="activate-btn"
      >
        {{ loading ? 'Activando...' : 'Activar tarjeta' }}
      </button>
    </ng-container>

    <!-- Si YA está activada -->
    <ng-template #activatedCard>
      <div class="activated-banner">
        🎉 Tarjeta activada correctamente
      </div>
    </ng-template>
  </div>
</div>
