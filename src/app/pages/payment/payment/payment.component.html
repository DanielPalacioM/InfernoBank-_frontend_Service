<div class="payment-container">
  <h1>💳 Pago del Servicio</h1>

  <div *ngIf="service">
    <p><strong>Servicio:</strong> {{ service.name }}</p>
    <p><strong>Precio:</strong> {{ service.precio_mensual | currency:'USD' }}</p>
    <p><strong>Detalles:</strong> {{ service.detalles }}</p>
    <p><strong>Estado:</strong> {{ service.estado }}</p>

    <button (click)="pagar()" [disabled]="loading">
      {{ loading ? 'Procesando...' : 'Confirmar Pago' }}
    </button>
  </div>

  <div *ngIf="resultado">
    <p>✅ Pago exitoso, traceId: {{ resultado.traceId }}</p>
  </div>

  <!-- 🔙 Botones de navegación -->
  <div class="nav-buttons">
    <button (click)="goBack()" class="btn-back">⬅️ Volver</button>
    <button routerLink="/home" class="btn-home">🏠 Ir al Home</button>
  </div>
</div>
